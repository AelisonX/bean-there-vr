services:
  - type: web
    name: bean-there-vr
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24
      - key: ALLOWED_ORIGINS
        value: https://aelisonx.github.io,https://bean-there-vr.onrender.com
